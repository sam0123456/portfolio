<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141824" />
      <stop offset="50%" stop-color="#0c0e17" />
      <stop offset="100%" stop-color="#090a0f" />
    </linearGradient>

    <!-- Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#6366f1" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#4338ca" stop-opacity="0.7" />
    </linearGradient>

    <!-- Text Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Status Glow -->
    <filter id="dotGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="1.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Base Squircle -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="2" />

  <!-- Code Monogram: SR -->
  <g font-family="'Outfit', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="25" letter-spacing="-0.5">
    <!-- 'S' in Indigo/Violet Accent -->
    <text x="14" y="41" fill="#818cf8" filter="url(#glow)">S</text>
    <!-- 'R' in Crisp Light Slate -->
    <text x="29" y="41" fill="#f1f5f9">R</text>
  </g>

  <!-- Developer Active Status Dot (Emerald) -->
  <circle cx="49" cy="20" r="3.5" fill="#10b981" filter="url(#dotGlow)" />
  <circle cx="49" cy="20" r="1.8" fill="#a7f3d0" />
</svg>
